name: build-images

# Builds the two images the per-cluster opencode agents pull, multi-arch
# (linux/amd64 + linux/arm64), and pushes them to GHCR:
#
#   ghcr.io/emanuele-leopardi/opencode-agent:<tag>
#   ghcr.io/emanuele-leopardi/zen-bridge:<tag>
#
# <tag> is the UTC date of the build (e.g. 2026-11-22) unless overridden when
# dispatched by hand. The clusters' manifests pin that immutable date tag;
# `latest` and `sha-<short>` are published as a convenience.
#
# Uses only the automatic GITHUB_TOKEN (permissions.packages: write), so no
# repository secret is required.

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "zen-bridge/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: UTC date, YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: opencode-agent
            context: agent
          - image: zen-bridge
            context: zen-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 is emulated (the Oracle clusters are Ampere); amd64 is native.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag="$(date -u +%Y-%m-%d)"
          fi
          short="sha-${GITHUB_SHA::7}"
          base="${REGISTRY}/${{ github.repository_owner }}/${{ matrix.image }}"
          {
            echo "tags<<EOF"
            echo "${base}:${tag}"
            echo "${base}:${short}"
            echo "${base}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${base}:${tag} (also ${short}, latest)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ matrix.image }}\`"
            echo
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
            echo
            echo "Pin the clusters' manifests to \`${{ steps.meta.outputs.primary }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
